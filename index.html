<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POA Personality Quiz</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="quiz-container">
    <div id="progress-container" class="progress-container">
      <div id="progress-bar" class="progress-bar"></div>
    </div>

    <div id="quiz-screen">
      <div class="image-wrapper">
        <div id="quiz-illustration" class="illustration-box">📊</div>
      </div>
      <p id="question-text" class="question-text"></p>
      <div id="options-container" class="options-container"></div>
      <p id="feedback-text" class="feedback-text hidden"></p>
    </div>

    <div id="result-screen" class="result-screen hidden">
      <div class="result-badge" id="result-emoji">🐰</div>
      <h2 id="result-title"></h2>
      <p id="result-quote" class="result-quote"></p>
      <p id="result-desc" class="result-desc"></p>

      <div class="style-card">
        <span class="style-tag" id="combo-tag"></span>
        <h3 id="combo-title"></h3>
        <p id="combo-desc"></p>
      </div>

      <button id="restart-btn" class="option-btn">Retake Quiz 🔄</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
